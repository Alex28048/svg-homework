<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <svg width="650" height="550">
        <rect x="145" y="300" width="50" height="130" fill="url(#telegram)"/>
        <rect x="275" y="190" width="50" height="240" fill="url(#messenger)"/>
        <rect x="415" y="345" width="50" height="85" fill="url(#viber)"/>

        <defs>    
            <linearGradient id="telegram" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="blue"/>
                <stop offset="100%" stop-color="white"/>
            </linearGradient>
            <linearGradient id="messenger" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="lightblue"/>
                <stop offset="100%" stop-color="white"/>
            </linearGradient>
            <linearGradient id="viber" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="violet"/>
                <stop offset="100%" stop-color="darkgrey"/>
            </linearGradient>
        </defs>

        <line x1="80" y1="40"
              x2="80" y2="430"
              stroke="black"
              stroke-width="6"/>

        <line x1="80" y1="430"
              x2="550" y2="430"
              stroke="black"
              stroke-width="6"/>

        <line x1="70" y1="110"
              x2="90" y2="110"
              stroke="black"
              stroke-width="6"/>

        <line x1="70" y1="220"
              x2="90" y2="220"
              stroke="black"
              stroke-width="6"/>

        <line x1="70" y1="350"
              x2="90" y2="350"
              stroke="black"
              stroke-width="6"/>

        <text class="name" x="175" y="455"><tspan dy="8">T</tspan><tspan dy="-8">elegram</tspan></text>

        <text class="name" x="305" y="455">M<tspan dy="8">e</tspan><tspan dy="-8">ssenger</tspan></text>

        <text class="name" x="445" y="455">Vi<tspan dy="8">b</tspan><tspan dy="-8">er</tspan></text>

        <text class="num" x="45" y="117">100</text>
        <text class="num" x="50" y="227">10</text>
        <text class="num" x="55" y="357">1</text>
       
        <image href="telegram.png" x="140" y="220" width="60" height="60"/>

        <image href="messenger.png" x="270" y="110" width="60" height="60"/>

       <image href="viber.png" x="410" y="265" width="60" height="60"/>

       <line x1="105" y1="315"
             x2="132" y2="282"
             stroke="black"
             stroke-width="6"/>

        <line x1="195" y1="210"
              x2="253" y2="150"
              stroke="black"
              stroke-width="6"/>

        <line x1="347" y1="150"
              x2="405" y2="255"
              stroke="black"
              stroke-width="6"/>
    </svg>
    
</body>
</html>
